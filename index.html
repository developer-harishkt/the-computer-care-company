<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something is Cooking | THE COMPUTER CARE COMPANY</title>
    <style>
        :root {
            --bg: #eef2f7;
            --ink: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
            --pan: #1e293b;
            --pan-light: #334155;
            --handle: #78350f;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 25% 15%, #dbeafe, transparent 55%),
                var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .wrap { max-width: 560px; width: 100%; }

        /* ---- Pan assembly ---- */
        .pan-scene {
            position: relative;
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 36px;
        }

        .pan {
            position: relative;
            width: 170px;
            height: 130px;
            transform-origin: 70% 90%;
            animation: bounce 1.15s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        }

        .pan-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 140px;
            height: 56px;
            background: linear-gradient(180deg, var(--pan-light), var(--pan));
            border-radius: 0 0 70px 70px;
            box-shadow:
                inset 0 6px 0 rgba(255, 255, 255, 0.08),
                0 14px 22px -12px rgba(15, 23, 42, 0.55);
        }

        /* the rim / opening of the pan */
        .pan-rim {
            position: absolute;
            bottom: 50px;
            left: -6px;
            width: 152px;
            height: 16px;
            background: linear-gradient(180deg, #475569, #1e293b);
            border-radius: 50%;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        }

        .pan-handle {
            position: absolute;
            bottom: 34px;
            left: 138px;
            width: 88px;
            height: 14px;
            background: linear-gradient(180deg, #92400e, var(--handle));
            border-radius: 8px;
            transform: rotate(-16deg);
            transform-origin: left center;
            box-shadow: 0 6px 10px -8px rgba(15, 23, 42, 0.6);
        }
        .pan-handle::after {
            content: "";
            position: absolute;
            right: -10px;
            top: -6px;
            width: 22px;
            height: 26px;
            background: linear-gradient(180deg, #92400e, var(--handle));
            border-radius: 8px;
        }

        /* ---- Flying ingredients ---- */
        .ingredient {
            position: absolute;
            bottom: 76px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            animation: toss 1.15s ease-in-out infinite;
        }
        .ingredient.i2 { left: 46px; background: #f59e0b; animation-delay: 0.08s; }
        .ingredient.i3 { left: 66px; background: #10b981; animation-delay: 0.16s; animation-duration: 1.15s; }
        .ingredient.i1 { left: 58px; }

        /* ---- Steam ---- */
        .steam {
            position: absolute;
            bottom: 74px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(100, 116, 139, 0.35);
            opacity: 0;
            animation: steam 2.3s ease-out infinite;
        }
        .steam.s1 { left: 52px; }
        .steam.s2 { left: 72px; animation-delay: 0.5s; }
        .steam.s3 { left: 62px; animation-delay: 1s; }

        /* ---- Text ---- */
        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.75rem, 6vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        h1 span { color: var(--accent); }

        p {
            margin: 0 auto;
            max-width: 420px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--muted);
        }

        .dots::after {
            content: "";
            animation: dots 1.6s steps(4, end) infinite;
        }

        .brand {
            margin-top: 34px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #94a3b8;
        }

        /* ---- Animations ---- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            45%      { transform: translateY(-26px) rotate(3deg); }
        }

        @keyframes toss {
            0%   { transform: translateY(6px) scale(0.6); opacity: 0; }
            25%  { opacity: 1; }
            60%  { transform: translateY(-46px) scale(1); opacity: 1; }
            100% { transform: translateY(-4px) scale(0.7); opacity: 0; }
        }

        @keyframes steam {
            0%   { transform: translateY(0) scale(0.6); opacity: 0; }
            30%  { opacity: 0.8; }
            100% { transform: translateY(-70px) scale(1.4); opacity: 0; }
        }

        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pan, .ingredient, .steam, .dots::after { animation: none; }
            .ingredient { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="pan-scene" aria-hidden="true">
            <div class="pan">
                <span class="ingredient i1"></span>
                <span class="ingredient i2"></span>
                <span class="ingredient i3"></span>
                <span class="steam s1"></span>
                <span class="steam s2"></span>
                <span class="steam s3"></span>
                <div class="pan-body"></div>
                <div class="pan-rim"></div>
                <div class="pan-handle"></div>
            </div>
        </div>

        <h1>Something is <span>cooking</span><span class="dots"></span></h1>
        <p>We&rsquo;re hard at work preparing something great. Please check back soon.</p>
        <div class="brand">The Computer Care Company</div>
    </div>
</body>
</html>
